<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="theme-color" content="#FAF7F2" />
<title>회독노트 · 2027.03.27 국가직</title>
<style>
  :root{
    --bg:#FAF7F2;
    --surface:#FFFFFF;
    --surface-2:#F3EFE7;
    --ink:#1E2433;
    --ink-2:#565E72;
    --muted:#8C93A4;
    --line:#E8E2D7;
    --navy:#23314D;
    --navy-soft:#EDF1F7;
    --sage:#2D7A5E;
    --sage-soft:#E6F4EE;
    --amber:#C97A16;
    --amber-soft:#FDF2E2;
    --coral:#C9514B;
    --coral-soft:#FCECEB;
    --shadow:0 8px 24px rgba(30,36,51,.05);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR",sans-serif;
    background:var(--bg);
    color:var(--ink);
    line-height:1.45;
    padding-bottom:100px;
    font-variant-numeric:tabular-nums;
  }
  .app{max-width:480px;margin:0 auto;padding:18px 16px 24px}

  /* Header Hero */
  .hero{
    background:linear-gradient(145deg,#202C45 0%,#2E3E61 100%);
    color:#FFFDF9;
    border-radius:26px;
    padding:20px 20px 18px;
    box-shadow:0 14px 32px rgba(32,44,69,.18);
    position:relative;
    overflow:hidden;
  }
  .hero::after{
    content:"";
    position:absolute;right:-28px;top:-28px;
    width:130px;height:130px;border-radius:50%;
    background:radial-gradient(circle,rgba(255,255,255,.11) 0%,rgba(255,255,255,0) 70%);
    pointer-events:none;
  }
  .hero-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
  .hero-kicker{font-size:11px;font-weight:700;letter-spacing:.3px;color:rgba(255,253,249,.72)}
  .hero-title{font-size:20px;font-weight:900;margin-top:3px;letter-spacing:-.4px}
  .dday-badge{
    background:rgba(255,255,255,.15);
    border:1px solid rgba(255,255,255,.22);
    backdrop-filter:blur(8px);
    padding:7px 13px;border-radius:14px;
    font-size:15px;font-weight:900;color:#FFE5A3;white-space:nowrap;
  }
  .hero-metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
  .metric{
    background:rgba(255,255,255,.1);
    border-radius:15px;padding:10px 8px;text-align:center;
  }
  .metric-val{font-size:17px;font-weight:900;letter-spacing:-.3px}
  .metric-lbl{font-size:11px;color:rgba(255,253,249,.75);margin-top:2px}
  .hero-foot{display:flex;justify-content:space-between;align-items:center;margin-top:13px;padding-top:11px;border-top:1px solid rgba(255,255,255,.12)}
  .week-dots{display:flex;gap:5px;align-items:center}
  .wdot{width:22px;height:22px;border-radius:7px;background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;color:rgba(255,255,255,.65)}
  .wdot.on{background:#66D2A3;color:#153629}
  .hero-edit{background:none;border:none;color:rgba(255,253,249,.82);font-size:11px;font-weight:700;cursor:pointer;padding:4px 6px}

  /* Section header */
  .sec-head{display:flex;justify-content:space-between;align-items:center;margin:20px 2px 10px}
  .sec-title{font-size:15px;font-weight:900;letter-spacing:-.3px;color:var(--ink)}
  .sec-action{background:var(--navy-soft);color:var(--navy);border:none;border-radius:11px;padding:6px 11px;font-size:12px;font-weight:800;cursor:pointer}

  /* Today Pace Banner */
  .pace-strip{
    background:var(--surface);border:1px solid var(--line);border-radius:18px;
    padding:13px 15px;margin-top:14px;box-shadow:var(--shadow);
    display:flex;align-items:center;justify-content:space-between;gap:12px;
  }
  .pace-strip-txt{font-size:13px;color:var(--ink-2)}
  .pace-strip-txt b{color:var(--navy);font-weight:900}
  .pill-tag{font-size:11px;font-weight:800;padding:4px 9px;border-radius:9px;white-space:nowrap}
  .pill-sage{background:var(--sage-soft);color:var(--sage)}
  .pill-amber{background:var(--amber-soft);color:var(--amber)}

  /* Subject Cards */
  .subj-card{
    background:var(--surface);border:1px solid var(--line);border-radius:20px;
    padding:16px;margin-bottom:12px;box-shadow:var(--shadow);
    position:relative;overflow:hidden;
  }
  .subj-stripe{position:absolute;left:0;top:14px;bottom:14px;width:4px;border-radius:0 4px 4px 0}
  .subj-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;padding-left:6px}
  .subj-name-row{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
  .subj-name{font-size:16px;font-weight:900;letter-spacing:-.3px}
  .round-chip{font-size:11px;font-weight:800;padding:3px 8px;border-radius:8px;background:var(--surface-2);color:var(--ink-2)}
  .round-chip.done{background:var(--sage-soft);color:var(--sage)}
  .icon-btn{background:none;border:none;color:var(--muted);font-size:15px;cursor:pointer;padding:2px 5px}

  .prog-meta{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--ink-2);font-weight:700;margin:11px 0 6px;padding-left:6px}
  .bar-track{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden;margin-left:6px}
  .bar-fill{height:100%;border-radius:99px;transition:width .25s ease}

  .pace-note{
    margin:11px 0 0 6px;padding:9px 11px;border-radius:12px;
    background:#FAF8F4;border:1px solid #EFEAE0;
    font-size:12px;color:var(--ink-2);
  }
  .pace-note strong{color:var(--navy)}

  .subj-actions{display:flex;gap:7px;margin:12px 0 0 6px}
  .btn{
    flex:1;padding:10px 12px;border-radius:13px;border:1px solid var(--line);
    background:var(--surface);color:var(--ink);font-size:13px;font-weight:800;cursor:pointer;
    transition:transform .08s;
  }
  .btn:active{transform:scale(.98)}
  .btn-main{background:var(--navy);color:#fff;border-color:var(--navy)}
  .btn-sage{background:var(--sage);color:#fff;border-color:var(--sage)}
  .btn-soft{flex:0 0 auto;padding:10px 13px;background:var(--surface-2);border-color:transparent;color:var(--ink-2)}
  .btn-hard{flex:0 0 auto;padding:10px 11px;background:var(--coral-soft);border-color:transparent;color:var(--coral);font-size:12px}

  /* Review List */
  .rev-card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:6px 15px;box-shadow:var(--shadow)}
  .rev-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
  .rev-row:last-child{border-bottom:none}
  .rev-title{font-size:13.5px;font-weight:800;color:var(--ink)}
  .rev-sub{font-size:11.5px;color:var(--muted);margin-top:2px}
  .rev-sub b.due{color:var(--amber)}
  .rev-sub b.hard{color:var(--coral)}
  .rev-done-btn{
    padding:8px 13px;border-radius:11px;border:none;
    background:var(--sage-soft);color:var(--sage);font-size:12px;font-weight:800;cursor:pointer;white-space:nowrap;
  }

  /* Forms & Settings */
  .card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
  .form-grid{display:grid;gap:10px}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  label{display:block;font-size:11px;font-weight:800;color:var(--ink-2);margin-bottom:4px}
  input,select{
    width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:12px;
    font-size:14px;background:#FCFBF8;color:var(--ink);
  }
  .preset-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
  .preset-chip{
    padding:6px 11px;border-radius:20px;border:1px solid var(--line);
    background:var(--surface-2);color:var(--ink-2);font-size:12px;font-weight:750;cursor:pointer;
  }
  .empty{text-align:center;color:var(--muted);font-size:13px;padding:28px 12px;line-height:1.6}

  /* Bottom Floating Nav */
  .nav-wrap{
    position:fixed;left:0;right:0;bottom:14px;z-index:40;
    display:flex;justify-content:center;padding:0 16px;pointer-events:none;
  }
  .nav{
    pointer-events:auto;width:100%;max-width:448px;
    background:rgba(255,255,255,.92);backdrop-filter:blur(14px);
    border:1px solid var(--line);border-radius:22px;
    padding:6px;display:grid;grid-template-columns:repeat(3,1fr);gap:4px;
    box-shadow:0 12px 30px rgba(30,36,51,.12);
  }
  .nav-btn{
    border:none;background:none;border-radius:16px;padding:9px 6px;
    font-size:12px;font-weight:800;color:var(--muted);cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:2px;
  }
  .nav-btn.active{background:var(--navy);color:#fff}
  .nav-ico{font-size:15px}

  /* Modal */
  .modal-bg{position:fixed;inset:0;background:rgba(20,24,36,.45);display:none;align-items:flex-end;justify-content:center;z-index:60}
  .modal-bg.open{display:flex}
  .modal{background:var(--surface);width:100%;max-width:480px;border-radius:24px 24px 0 0;padding:20px 18px 28px}
  .modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
  .modal-title{font-size:17px;font-weight:900}
  .close-btn{background:var(--surface-2);border:none;border-radius:10px;padding:7px 12px;font-size:12px;font-weight:800;cursor:pointer}
</style>
</head>
<body>
<div class="app">
  <section class="hero">
    <div class="hero-top">
      <div>
        <div class="hero-kicker">회독노트 · 국가직 합격 페이스메이커</div>
        <div class="hero-title" id="examTitle">2027 국가직 공무원</div>
      </div>
      <div class="dday-badge" id="ddayBadge">D-131</div>
    </div>
    <div class="hero-metrics">
      <div class="metric"><div class="metric-val" id="totalPct">0%</div><div class="metric-lbl">전체 진도율</div></div>
      <div class="metric"><div class="metric-val" id="todayCount">0</div><div class="metric-lbl">오늘 완료</div></div>
      <div class="metric"><div class="metric-val" id="dueCount">0</div><div class="metric-lbl">오늘 복습</div></div>
    </div>
    <div class="hero-foot">
      <div class="week-dots" id="weekDots"></div>
      <button class="hero-edit" id="openExamBtn">⚙ 시험일 수정</button>
    </div>
  </section>

  <!-- Tab 1: Subjects -->
  <div id="view-subjects">
    <div class="pace-strip">
      <div class="pace-strip-txt" id="paceSummary">오늘 목표를 차근차근 채워봐요.</div>
      <span class="pill-tag pill-sage" id="streakBadge">🔥 0일 연속</span>
    </div>
    <div class="sec-head">
      <div class="sec-title">과목별 진도 · 회독</div>
      <button class="sec-action" id="goAddBtn">+ 과목 추가</button>
    </div>
    <div id="subjectList"></div>
  </div>

  <!-- Tab 2: Reviews -->
  <div id="view-reviews" style="display:none">
    <div class="sec-head">
      <div class="sec-title">망각곡선 복습 큐 (1·3·7·14일)</div>
      <span class="pill-tag pill-amber" id="reviewFilterInfo">자동 등록</span>
    </div>
    <div class="rev-card" id="reviewList"></div>
  </div>

  <!-- Tab 3: Add & Backup -->
  <div id="view-manage" style="display:none">
    <div class="sec-head"><div class="sec-title">새 과목 추가</div></div>
    <div class="card">
      <div class="preset-row" id="presetChips">
        <button type="button" class="preset-chip" data-name="국어">국어</button>
        <button type="button" class="preset-chip" data-name="영어">영어</button>
        <button type="button" class="preset-chip" data-name="한국사">한국사</button>
        <button type="button" class="preset-chip" data-name="행정법총론">행정법총론</button>
        <button type="button" class="preset-chip" data-name="행정학개론">행정학개론</button>
        <button type="button" class="preset-chip" data-name="세법">세법</button>
      </div>
      <div class="form-grid" style="margin-top:10px">
        <div>
          <label>과목 · 교재명</label>
          <input id="fName" placeholder="예: 행정법 기본강의 / 한국사 기출" />
        </div>
        <div class="row2">
          <div>
            <label>단위</label>
            <select id="fUnit">
              <option value="강">인강 (강)</option>
              <option value="단원">단원</option>
              <option value="쪽">교재·기출 (쪽)</option>
              <option value="회">모의고사 (회)</option>
            </select>
          </div>
          <div>
            <label>현재 회독</label>
            <input id="fRound" type="number" min="1" value="1" />
          </div>
        </div>
        <div class="row2">
          <div>
            <label>전체 분량</label>
            <input id="fTotal" type="number" min="1" placeholder="예: 60" />
          </div>
          <div>
            <label>이미 한 분량</label>
            <input id="fDone" type="number" min="0" value="0" />
          </div>
        </div>
        <button class="btn btn-main" id="addSubjBtn">과목 등록하기</button>
      </div>
    </div>

    <div class="sec-head"><div class="sec-title">기록 백업 · 복원</div></div>
    <div class="card">
      <p style="font-size:12.5px;color:var(--ink-2);margin-bottom:11px">브라우저 캐시가 지워져도 복구할 수 있게 JSON 파일로 저장해 두세요.</p>
      <div style="display:flex;gap:8px">
        <button class="btn" id="exportBtn">내보내기</button>
        <button class="btn" id="importBtn">가져오기</button>
      </div>
      <input type="file" id="importFile" accept=".json" style="display:none" />
    </div>
  </div>
</div>

<div class="nav-wrap">
  <nav class="nav">
    <button class="nav-btn active" data-view="subjects"><span class="nav-ico">📚</span><span>진도</span></button>
    <button class="nav-btn" data-view="reviews"><span class="nav-ico">🔁</span><span>복습</span></button>
    <button class="nav-btn" data-view="manage"><span class="nav-ico">＋</span><span>추가·백업</span></button>
  </nav>
</div>

<div class="modal-bg" id="examModal">
  <div class="modal">
    <div class="modal-head">
      <div class="modal-title">목표 시험 설정</div>
      <button class="close-btn" id="closeExamBtn">닫기</button>
    </div>
    <div class="form-grid">
      <div><label>시험 이름</label><input id="mExamName" /></div>
      <div><label>시험 날짜</label><input id="mExamDate" type="date" /></div>
      <button class="btn btn-main" id="saveExamBtn">저장하기</button>
    </div>
  </div>
</div>

<script>
const KEY = 'hoedok_note_2027_v1';
const COLORS = ['#2E5AAC','#2D7A5E','#C97A16','#8D4B9E','#C9514B'];
const todayStr = () => {
  const d = new Date();
  const y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,'0'), day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
};
function addDays(base, n){
  const d = new Date(base + 'T00:00:00');
  d.setDate(d.getDate() + n);
  const y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,'0'), day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}

function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return {
    examName: '2027 국가직 공무원',
    examDate: '2027-03-27',
    activeDays: {},
    subjects: [
      { id:'s1', name:'국어 기본·기출', unit:'강', round:1, total:55, done:0, color:COLORS[0] },
      { id:'s2', name:'영어 구문·독해', unit:'강', round:1, total:45, done:0, color:COLORS[1] },
      { id:'s3', name:'한국사 올인원', unit:'강', round:1, total:60, done:0, color:COLORS[2] },
      { id:'s4', name:'행정법총론', unit:'강', round:1, total:64, done:0, color:COLORS[3] },
      { id:'s5', name:'행정학개론', unit:'강', round:1, total:56, done:0, color:COLORS[4] }
    ],
    reviews: []
  };
}
let state = load();
function save(){ localStorage.setItem(KEY, JSON.stringify(state)); }

function daysLeft(){
  const a = new Date(todayStr() + 'T00:00:00');
  const b = new Date((state.examDate || '2027-03-27') + 'T00:00:00');
  return Math.ceil((b - a) / 86400000);
}

function calcStreak(){
  let s = 0;
  let cur = todayStr();
  while(state.activeDays && state.activeDays[cur] > 0){
    s++; cur = addDays(cur, -1);
  }
  return s;
}

function renderHero(){
  document.getElementById('examTitle').textContent = state.examName || '2027 국가직 공무원';
  const d = daysLeft();
  document.getElementById('ddayBadge').textContent = d > 0 ? `D-${d}` : (d === 0 ? 'D-Day!' : `D+${Math.abs(d)}`);

  let tot = 0, dn = 0;
  state.subjects.forEach(s => { tot += Number(s.total)||0; dn += Math.min(Number(s.done)||0, Number(s.total)||0); });
  document.getElementById('totalPct').textContent = (tot ? Math.round((dn/tot)*100) : 0) + '%';

  const td = todayStr();
  document.getElementById('todayCount').textContent = (state.activeDays && state.activeDays[td]) || 0;
  const due = (state.reviews || []).filter(r => !r.done && r.dueDate <= td).length;
  document.getElementById('dueCount').textContent = due;

  // Weekly dots
  const wd = document.getElementById('weekDots');
  wd.innerHTML = '';
  const labels = ['일','월','화','수','목','금','토'];
  for(let i = 6; i >= 0; i--){
    const dt = addDays(td, -i);
    const dayIdx = new Date(dt + 'T00:00:00').getDay();
    const el = document.createElement('div');
    el.className = 'wdot' + ((state.activeDays && state.activeDays[dt] > 0) ? ' on' : '');
    el.textContent = labels[dayIdx];
    wd.appendChild(el);
  }

  const streak = calcStreak();
  document.getElementById('streakBadge').textContent = `🔥 ${streak}일 연속`;
  const todayDone = (state.activeDays && state.activeDays[td]) || 0;
  document.getElementById('paceSummary').innerHTML = todayDone > 0
    ? `오늘 벌써 <b>${todayDone}개</b> 완료! 이 페이스 그대로 가요.`
    : `남은 기간 <b>${Math.max(0, d)}일</b>, 오늘 첫 +1만 눌러도 시작이에요.`;
}

function esc(v){
  return String(v).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function recordComplete(s, isHard){
  if(s.done >= s.total) return;
  s.done++;
  const td = todayStr();
  if(!state.activeDays) state.activeDays = {};
  state.activeDays[td] = (state.activeDays[td] || 0) + 1;

  const offsets = isHard ? [1, 3, 7, 14] : [1, 3, 7];
  const label = `${s.name} · ${s.round}회독 ${s.done}${s.unit}`;
  offsets.forEach(off => {
    state.reviews.push({
      id: 'r_' + Date.now() + '_' + off + '_' + Math.random().toString(36).slice(2,5),
      label,
      offset: off,
      hard: !!isHard,
      dueDate: addDays(td, off),
      done: false
    });
  });
  save(); renderAll();
}

function renderSubjects(){
  const box = document.getElementById('subjectList');
  box.innerHTML = '';
  const d = Math.max(1, daysLeft());

  if(!state.subjects.length){
    box.innerHTML = '<div class="card empty">등록된 과목이 없어요.<br><b>+ 과목 추가</b>를 눌러 과목을 만들어 보세요!</div>';
    return;
  }

  state.subjects.forEach((s, idx) => {
    const color = s.color || COLORS[idx % COLORS.length];
    const pct = s.total ? Math.min(100, Math.round((s.done / s.total) * 100)) : 0;
    const remain = Math.max(0, s.total - s.done);
    const perDay = remain > 0 ? remain / d : 0;
    const paceStr = remain === 0
      ? '✨ 이번 회독 완주! 다음 회독으로 넘겨보세요.'
      : `남은 ${remain}${esc(s.unit)} ÷ ${d}일 → 하루 <strong>${perDay < 1 ? perDay.toFixed(2) : (Math.ceil(perDay*10)/10)}${esc(s.unit)}</strong>씩`;

    const el = document.createElement('div');
    el.className = 'subj-card';
    el.innerHTML = `
      <div class="subj-stripe" style="background:${color}"></div>
      <div class="subj-top">
        <div class="subj-name-row">
          <span class="subj-name">${esc(s.name)}</span>
          <span class="round-chip ${remain===0?'done':''}">${s.round}회독</span>
        </div>
        <button class="icon-btn del-btn" title="삭제">✕</button>
      </div>
      <div class="prog-meta">
        <span>${s.done} / ${s.total} ${esc(s.unit)}</span>
        <span>${pct}%</span>
      </div>
      <div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:${color}"></div></div>
      <div class="pace-note">${paceStr}</div>
      <div class="subj-actions">
        <button class="btn btn-soft minus-btn">-1</button>
        ${remain === 0
          ? '<button class="btn btn-sage next-btn">🔁 다음 회독 시작</button>'
          : `<button class="btn btn-main plus-btn">+1 ${esc(s.unit)} 완료</button><button class="btn btn-hard hard-btn" title="어려워서 14일 복습까지 추가">😰 헷갈림</button>`}
      </div>
    `;

    el.querySelector('.del-btn').onclick = () => {
      if(confirm(`'${s.name}' 과목을 지울까요?`)){
        state.subjects = state.subjects.filter(x => x.id !== s.id);
        save(); renderAll();
      }
    };
    el.querySelector('.minus-btn').onclick = () => {
      if(s.done > 0){ s.done--; save(); renderAll(); }
    };
    const plus = el.querySelector('.plus-btn');
    if(plus) plus.onclick = () => recordComplete(s, false);
    const hard = el.querySelector('.hard-btn');
    if(hard) hard.onclick = () => recordComplete(s, true);
    const nxt = el.querySelector('.next-btn');
    if(nxt) nxt.onclick = () => { s.round = (Number(s.round)||1) + 1; s.done = 0; save(); renderAll(); };

    box.appendChild(el);
  });
}

function renderReviews(){
  const box = document.getElementById('reviewList');
  const td = todayStr();
  const pending = (state.reviews || []).filter(r => !r.done).sort((a,b) => a.dueDate.localeCompare(b.dueDate));
  if(!pending.length){
    box.innerHTML = '<div class="empty">아직 밀린 복습이 없어요.<br>과목에서 <b>+1 완료</b>나 <b>😰 헷갈림</b>을 누르면<br>1·3·7일(헷갈림은 14일) 뒤 복습이 자동으로 쌓여요.</div>';
    return;
  }
  box.innerHTML = '';
  pending.slice(0, 40).forEach(r => {
    const isDue = r.dueDate <= td;
    const row = document.createElement('div');
    row.className = 'rev-row';
    row.innerHTML = `
      <div>
        <div class="rev-title">${esc(r.label)}</div>
        <div class="rev-sub">
          ${r.offset}일차 복습 · ${r.hard ? '<b class="hard">헷갈림 체크 · </b>' : ''}${isDue ? '<b class="due">오늘 복습!</b>' : esc(r.dueDate) + ' 예정'}
        </div>
      </div>
      <button class="rev-done-btn">완료 ✓</button>
    `;
    row.querySelector('.rev-done-btn').onclick = () => { r.done = true; save(); renderAll(); };
    box.appendChild(row);
  });
}

function renderAll(){ renderHero(); renderSubjects(); renderReviews(); }

function switchView(v){
  ['subjects','reviews','manage'].forEach(k => {
    document.getElementById('view-' + k).style.display = (k === v) ? 'block' : 'none';
  });
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.toggle('active', b.dataset.view === v));
}
document.querySelectorAll('.nav-btn').forEach(b => b.onclick = () => switchView(b.dataset.view));
document.getElementById('goAddBtn').onclick = () => { switchView('manage'); document.getElementById('fName').focus(); };

document.querySelectorAll('.preset-chip').forEach(c => {
  c.onclick = () => { document.getElementById('fName').value = c.dataset.name; document.getElementById('fTotal').focus(); };
});

document.getElementById('addSubjBtn').onclick = () => {
  const name = document.getElementById('fName').value.trim();
  const unit = document.getElementById('fUnit').value;
  const round = Math.max(1, Number(document.getElementById('fRound').value) || 1);
  const total = Math.max(1, Number(document.getElementById('fTotal').value) || 0);
  const done = Math.max(0, Math.min(total, Number(document.getElementById('fDone').value) || 0));
  if(!name || !total){ alert('과목명과 전체 분량을 입력해 주세요!'); return; }
  state.subjects.push({ id:'s_'+Date.now(), name, unit, round, total, done, color:COLORS[state.subjects.length % COLORS.length] });
  save();
  document.getElementById('fName').value = '';
  document.getElementById('fTotal').value = '';
  document.getElementById('fDone').value = '0';
  switchView('subjects');
  renderAll();
};

document.getElementById('openExamBtn').onclick = () => {
  document.getElementById('mExamName').value = state.examName || '';
  document.getElementById('mExamDate').value = state.examDate || '2027-03-27';
  document.getElementById('examModal').classList.add('open');
};
document.getElementById('closeExamBtn').onclick = () => document.getElementById('examModal').classList.remove('open');
document.getElementById('saveExamBtn').onclick = () => {
  state.examName = document.getElementById('mExamName').value.trim() || '2027 국가직 공무원';
  state.examDate = document.getElementById('mExamDate').value || '2027-03-27';
  save();
  document.getElementById('examModal').classList.remove('open');
  renderAll();
};

document.getElementById('exportBtn').onclick = () => {
  const blob = new Blob([JSON.stringify(state, null, 2)], { type:'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `hoedok-note-${todayStr()}.json`;
  a.click();
};
document.getElementById('importBtn').onclick = () => document.getElementById('importFile').click();
document.getElementById('importFile').onchange = e => {
  const f = e.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = () => {
    try{
      const p = JSON.parse(r.result);
      if(p && Array.isArray(p.subjects)){ state = p; save(); renderAll(); alert('복원 완료!'); }
    }catch(err){ alert('올바른 백업 파일이 아니에요.'); }
  };
  r.readAsText(f);
};

renderAll();
</script>
</body>
</html>
